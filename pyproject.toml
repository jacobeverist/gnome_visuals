[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnomevisual"
version = "0.1.0"
description = "Visualization of Experiments with Gnome Codes"
authors = [{name = "Jacob Everist", email = "jacob.everist@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.23.5",
    "intervals>=0.9.2",
    "colorcet>=3.0.1",
    "matplotlib>=3.3.4",
    "seaborn>=0.12.2",
    "manim>=0.17.2",
    "icecream>=2.1.3",
    "gnomecode>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "line_profiler_pycharm>=1.2.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=5.0",
    "isort>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gnomevisual*"]

[tool.setuptools.package-data]
gnomevisual = ["py.typed"]
