[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnomevisual"
version = "0.1.0"
description = "Visualization toolkit for Gnome Codes - scalar encoding using binary population codes"
authors = [{ name = "Jacob Everist", email = "jacob.everist@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # Core numerical and utility
    "numpy>=1.23.5",
    "intervals>=0.9.2",
    "icecream>=2.1.3",

    # Matplotlib ecosystem
    "matplotlib>=3.3.4",
    "seaborn>=0.12.2",
    "colorcet>=3.0.1",
    "pillow>=11.3.0",

    # Manim ecosystem
    "manim>=0.17.2",
    "colour>=0.1.5",
    "pygments>=2.0",

    # Dash/Plotly ecosystem
    "dash>=2.14.0",
    "plotly>=5.17.0",
    "dash-bootstrap-components>=1.5.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0",
    "pytest-cov>=4.0",

    # Code quality
    "black>=22.0",
    "flake8>=5.0",
    "isort>=5.0",

    # Profiling
    "line_profiler_pycharm>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/jacobeverist/gnome_visuals"
Repository = "https://github.com/jacobeverist/gnome_visuals"
Documentation = "https://github.com/jacobeverist/gnome_visuals/blob/main/CLAUDE.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["gnomevisual*"]

[tool.setuptools.package-data]
gnomevisual = ["py.typed"]

# Tool configurations
[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | media
  | outputs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["media/*", "outputs/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=gnomevisual --cov-report=term-missing"
